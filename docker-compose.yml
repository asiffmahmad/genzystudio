version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: genzystudio_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: genzystudio
      MYSQL_USER: genzy
      MYSQL_PASSWORD: genzypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
